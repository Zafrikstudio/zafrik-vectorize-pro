<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAFRIK VECTORIZE PRO V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#161a2d;background:linear-gradient(135deg,#f8fbff,#fff7fb)}
header{padding:27px 18px;text-align:center;background:#fff;border-bottom:1px solid #e5e9f2}h1{margin:0;font-size:34px;font-weight:900}h1 span{background:linear-gradient(90deg,#315cff,#813dff,#ff3489);-webkit-background-clip:text;color:transparent}header p{color:#6b7387}
.app{max-width:1280px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}.card{background:#fff;border:1px solid #e1e6f0;border-radius:22px;padding:20px;box-shadow:0 12px 35px #2d395e14;margin-bottom:16px}.title{font-size:18px;font-weight:900;margin-bottom:15px}
.upload{min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed #b9c7df;border-radius:18px;background:#f9fbff;cursor:pointer;text-align:center}.upload input{display:none}.upload b{margin:9px}.upload small{color:#737d91}
select{width:100%;padding:12px;border:1px solid #ccd5e4;border-radius:11px;background:#fff}.control{margin:15px 0}.control label{display:block;font-weight:800;font-size:13px;color:#4f5a72;margin-bottom:8px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer}.primary,.download{background:linear-gradient(90deg,#315cff,#823dff,#ff3489);color:white}.preview{height:650px;border-radius:17px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#fff;background-image:linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.preview img{max-width:100%;max-height:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.compare button{padding:11px;border:1px solid #d5dce9;border-radius:11px;background:#f5f7fb;font-weight:900;cursor:pointer}.compare .active{background:#ebe5ff;color:#5429c9}
.status{margin-top:12px;padding:12px;background:#f5f7fb;border-radius:11px;color:#667187;font-size:13px}.download{width:100%;border:0;border-radius:12px;padding:15px;font-weight:900;margin-top:12px;cursor:pointer}.download:disabled{opacity:.4}.badge{display:inline-block;padding:7px 11px;border-radius:20px;background:#efeaff;color:#653cff;font-size:11px;font-weight:900;margin-bottom:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.preview{height:480px}}
</style></head><body>
<header><div class="badge">VECTOR REAL EN SERVIDOR</div><h1>ZAFRIK <span>VECTORIZE PRO V3</span></h1><p>Convierte PNG, JPG y WEBP a SVG con trazados vectoriales reales.</p></header>
<div class="app"><div class="grid"><div>
<div class="card"><div class="title">1. SUBIR IMAGEN</div><label class="upload"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><div style="font-size:38px">🖼️</div><b>Seleccionar imagen</b><small>Máximo 25 MB</small></label></div>
<div class="card"><div class="title">2. TIPO DE VECTOR</div><div class="control"><label>Modo de trazado</label><select id="mode"><option value="detail">Máximo detalle</option><option value="flat">Colores planos</option></select></div>
<button class="btn primary" id="go">✨ VECTORIZE PRO</button>
<div class="status">Máximo detalle: ilustraciones complejas. Colores planos: logos y diseños con menos tonos.</div></div>
</div>
<div class="card"><div class="compare"><button id="before" class="active">👁 ANTES</button><button id="after">✨ VECTOR</button></div>
<div class="preview"><img id="preview" style="display:none"><div id="empty"><b>SUBE UNA IMAGEN PARA COMENZAR</b></div></div>
<div class="status" id="status">Esperando imagen.</div><button class="download" id="download" disabled>⬇ DESCARGAR SVG VECTORIAL</button>
</div></div></div>
<script>
const f=document.getElementById('file'),p=document.getElementById('preview'),empty=document.getElementById('empty'),status=document.getElementById('status'),dl=document.getElementById('download'),before=document.getElementById('before'),after=document.getElementById('after');
let originalURL='',vectorURL='',job='';
f.onchange=()=>{if(!f.files[0])return;if(originalURL)URL.revokeObjectURL(originalURL);originalURL=URL.createObjectURL(f.files[0]);p.src=originalURL;p.style.display='block';empty.style.display='none';before.classList.add('active');after.classList.remove('active');status.textContent='Imagen cargada. Pulsa VECTORIZE PRO.';dl.disabled=true};
before.onclick=()=>{if(!originalURL)return;p.src=originalURL;before.classList.add('active');after.classList.remove('active')};
after.onclick=()=>{if(!vectorURL)return;p.src=vectorURL;after.classList.add('active');before.classList.remove('active')};
document.getElementById('go').onclick=async()=>{if(!f.files[0]){alert('Primero sube una imagen.');return}status.textContent='Vectorizando en el servidor...';dl.disabled=true;const fd=new FormData();fd.append('image',f.files[0]);fd.append('mode',document.getElementById('mode').value);try{const r=await fetch('/api/vectorize',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');job=j.job;vectorURL=j.svg+'?t='+Date.now();p.src=vectorURL;after.classList.add('active');before.classList.remove('active');dl.disabled=false;status.textContent='Vectorización terminada. Revisa el resultado y descarga el SVG.'}catch(e){status.textContent='Error: '+e.message}};
dl.onclick=()=>{if(job)location.href='/api/download/'+job};
</script></body></html>
